# pnpm 11 requires dependency build scripts to be allowed explicitly.
# esbuild ships prebuilt per-platform binaries, so its build is optional,
# but allowing it keeps behaviour identical to pnpm 10.
allowBuilds:
  esbuild: true
# pnpm 11 no longer reads settings from the "pnpm" field in package.json.
# These overrides are security pins - see the note in package.json history.
overrides:
  "tailwindcss>nanoid": 3.3.18
  tar: ">=7.5.11"
  rollup: ">=4.59.0"
  dompurify: 3.4.13
  lodash: ">=4.18.0"
  lodash-es: ">=4.18.0"
  qs: 6.15.2
  mdast-util-to-hast: 13.2.1
  esbuild: 0.28.2
  path-to-regexp: ">=0.1.13"
  picomatch: ">=4.0.4"
  mermaid: 11.16.1
  uuid: 11.1.1
  follow-redirects: 1.16.0
  form-data: 4.0.6
  "@babel/core": 7.29.7
  body-parser: ">=2.3.0"
