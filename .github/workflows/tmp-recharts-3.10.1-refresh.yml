name: Temporary Recharts 3.10.1 migration validation

on:
  push:
    branches:
      - deps/recharts-3.10.1-20260817

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/recharts-3.10.1-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Upgrade Recharts and matching React helper
        run: pnpm add 'recharts@^3.10.1' 'react-is@19.2.8'

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify exact migration versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const expected = new Map([
            ['node_modules/recharts/package.json', '3.10.1'],
            ['node_modules/react-is/package.json', '19.2.8'],
            ['node_modules/react/package.json', '19.2.8'],
            ['node_modules/react-dom/package.json', '19.2.8'],
          ]);
          for (const [file, want] of expected) {
            const got = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (got !== want) throw new Error(`${file}: expected ${want}; got ${got}`);
            console.log(`${file}: ${got} VERIFIED`);
          }
          NODE

      - name: Format migration files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml client/src/components/ui/chart.tsx .github/workflows/tmp-recharts-3.10.1-refresh.yml

      - name: Run repository CI
        run: pnpm run ci

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-recharts-3.10.1-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml client/src/components/ui/chart.tsx .github/workflows/tmp-recharts-3.10.1-refresh.yml
          git commit -m "chore(deps): migrate Recharts to 3.10.1"
          git push origin HEAD:deps/recharts-3.10.1-20260817
