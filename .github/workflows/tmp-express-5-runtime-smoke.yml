name: Temporary Express 5 runtime migration validation

on:
  push:
    branches:
      - deps/express-current-20260817

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/express-current-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Assert live registry targets
        shell: bash
        run: |
          set -euo pipefail
          express_latest="$(npm view express version)"
          types_latest="$(npm view @types/express version)"
          test "$express_latest" = "5.2.1" || {
            echo "Expected express latest=5.2.1; got $express_latest" >&2
            exit 1
          }
          test "$types_latest" = "5.0.6" || {
            echo "Expected @types/express latest=5.0.6; got $types_latest" >&2
            exit 1
          }
          echo "express latest=$express_latest VERIFIED"
          echo "@types/express latest=$types_latest VERIFIED"

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify exact installed versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const expected = new Map([
            ['node_modules/express/package.json', '5.2.1'],
            ['node_modules/@types/express/package.json', '5.0.6'],
          ]);
          for (const [file, want] of expected) {
            const got = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (got !== want) throw new Error(`${file}: expected ${want}; got ${got}`);
            console.log(`${file}: ${got} VERIFIED`);
          }
          NODE

      - name: Format migrated source and workflow
        run: pnpm exec prettier --write server/index.ts .github/workflows/tmp-express-5-runtime-smoke.yml

      - name: Run repository CI
        run: pnpm run ci

      - name: Smoke test production Express 5 SPA routing
        shell: bash
        run: |
          set -euo pipefail
          export NODE_ENV=production
          export PORT=3100
          node dist/index.js > /tmp/techbridge-express.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error --output /tmp/root.html --dump-header /tmp/root.headers http://127.0.0.1:3100/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/techbridge-express.log >&2 || true
            exit 1
          fi

          curl --fail --silent --show-error --output /tmp/nested.html --dump-header /tmp/nested.headers http://127.0.0.1:3100/smoke/nested/route
          grep -qi '^content-type: text/html' /tmp/root.headers
          grep -qi '^content-type: text/html' /tmp/nested.headers
          cmp --silent /tmp/root.html /tmp/nested.html
          echo "Express 5 root and nested SPA fallback VERIFIED"

      - name: Commit formatted migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-express-5-runtime-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts .github/workflows/tmp-express-5-runtime-smoke.yml
          if git diff --cached --quiet; then
            echo "No publication changes required"
            exit 0
          fi
          git commit -m "fix(server): finalize Express 5 SPA route migration"
          git push origin HEAD:deps/express-current-20260817
