name: dependency-zero-remediate

on:
  push:
    branches:
      - agent/dependency-zero-audit-20260816

permissions:
  contents: write

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patched dependency floors
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));

          pkg.dependencies.axios = '1.19.0';
          pkg.dependencies.nanoid = '5.1.16';

          pkg.devDependencies.vitest = '3.2.6';
          pkg.devDependencies.vite = '7.3.6';
          pkg.devDependencies.postcss = '8.5.26';
          pkg.devDependencies.esbuild = '0.28.2';
          pkg.devDependencies.pnpm = '10.34.5';
          pkg.packageManager = 'pnpm@10.34.5';

          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          const o = pkg.pnpm.overrides;
          o['tailwindcss>nanoid'] = '3.3.18';
          o['dompurify'] = '3.4.13';
          o['qs'] = '6.15.2';
          o['mdast-util-to-hast'] = '13.2.1';
          o['esbuild'] = '0.28.2';
          o['mermaid'] = '11.16.1';
          o['uuid'] = '11.1.1';
          o['follow-redirects'] = '1.16.0';
          o['form-data'] = '4.0.6';
          o['@babel/core'] = '7.29.7';
          o['body-parser'] = '1.20.6';

          fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Full repository CI
        run: pnpm run ci

      - name: Zero-vulnerability audit gate
        run: pnpm audit --audit-level=low

      - name: Commit verified dependency remediation
        shell: bash
        run: |
          git diff -- package.json pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(security): remediate dependency audit findings"
          git push origin HEAD:agent/dependency-zero-audit-20260816
