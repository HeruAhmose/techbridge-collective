name: security-audit-evidence

on:
  push:
    branches:
      - agent/security-audit-20260816

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Capture full audit JSON evidence
        shell: bash
        run: |
          set +e
          pnpm audit --json > audit.json
          exit 0

      - name: Commit audit evidence to isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          git commit -m "chore(security): capture dependency audit evidence"
          git push origin HEAD:agent/security-audit-20260816
