name: Public Browser Certification Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Verify public HTTP
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://techbridge-collective.org/ > /tmp/root.html
          grep -Fq 'TechBridge Collective' /tmp/root.html
          echo 'PUBLIC_HTTP=PASS'
      - name: Execute public site through Chrome DevTools Protocol
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          rm -rf /tmp/techbridge-chrome
          "$chrome" \
            --headless --no-sandbox --no-first-run \
            --remote-debugging-port=9222 --user-data-dir=/tmp/techbridge-chrome \
            --disable-background-networking --disable-component-update \
            https://techbridge-collective.org/ >/tmp/techbridge-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true; wait "$chrome_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:9222/json >/tmp/targets.json && break
            sleep 0.5
          done
          test -s /tmp/targets.json

          cat > /tmp/assert-techbridge.mjs <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let target;
          for (let attempt = 0; attempt < 40; attempt += 1) {
            const targets = await fetch('http://127.0.0.1:9222/json').then(r => r.json());
            target = targets.find(t => t.type === 'page' && t.url.includes('techbridge-collective.org'));
            if (target) break;
            await sleep(250);
          }
          if (!target?.webSocketDebuggerUrl) throw new Error('TechBridge page target not found');
          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });
          let id = 0;
          const pending = new Map();
          ws.addEventListener('message', event => {
            const msg = JSON.parse(event.data);
            if (!msg.id) return;
            const waiter = pending.get(msg.id);
            if (!waiter) return;
            pending.delete(msg.id);
            msg.error ? waiter.reject(new Error(JSON.stringify(msg.error))) : waiter.resolve(msg.result);
          });
          const send = (method, params = {}) => {
            const messageId = ++id;
            return new Promise((resolve, reject) => {
              pending.set(messageId, { resolve, reject });
              ws.send(JSON.stringify({ id: messageId, method, params }));
            });
          };
          await send('Runtime.enable');
          let snapshot;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            await sleep(500);
            const result = await send('Runtime.evaluate', {
              expression: `JSON.stringify({rootChildren: document.getElementById('root')?.childElementCount || 0, text: (document.body?.innerText || '').slice(0,12000)})`,
              returnByValue: true,
            });
            if (!result?.result?.value) continue;
            snapshot = JSON.parse(result.result.value);
            if (snapshot.rootChildren > 0 && /TechBridge Collective|Digital Navigator/i.test(snapshot.text)) break;
          }
          console.log(JSON.stringify(snapshot, null, 2));
          if (!snapshot || snapshot.rootChildren <= 0) throw new Error('React root did not commit');
          if (!/TechBridge Collective|Digital Navigator/i.test(snapshot.text)) throw new Error('Expected TechBridge content not rendered');
          ws.close();
          NODE

          timeout --kill-after=5s 30s node /tmp/assert-techbridge.mjs
          echo 'PUBLIC_BROWSER_RENDER=PASS'
