name: Temporary Framer Motion v13 migration validation

on:
  push:
    branches:
      - deps/framer-motion-13-live-20260817

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/framer-motion-13-live-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Resolve and assert live registry target
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view framer-motion version)"
          major="${latest%%.*}"
          test "$major" = "13" || {
            echo "Expected current Framer Motion major 13; live registry reports $latest" >&2
            exit 1
          }
          echo "FRAMER_MOTION_LATEST=$latest" >> "$GITHUB_ENV"
          echo "framer-motion live latest=$latest VERIFIED"

      - name: Upgrade Framer Motion to exact live latest
        run: pnpm add "framer-motion@${FRAMER_MOTION_LATEST}"

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify exact migration version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const got = JSON.parse(fs.readFileSync('node_modules/framer-motion/package.json', 'utf8')).version;
          const want = process.env.FRAMER_MOTION_LATEST;
          if (!want || got !== want) throw new Error(`framer-motion expected ${want}; got ${got}`);
          console.log(`framer-motion ${got} VERIFIED`);
          NODE

      - name: Format migration files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml .github/workflows/tmp-framer-motion-13-live.yml

      - name: Run repository CI
        run: pnpm run ci

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-framer-motion-13-live.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/tmp-framer-motion-13-live.yml
          git commit -m "chore(deps): migrate Framer Motion to ${FRAMER_MOTION_LATEST}"
          git push origin HEAD:deps/framer-motion-13-live-20260817
