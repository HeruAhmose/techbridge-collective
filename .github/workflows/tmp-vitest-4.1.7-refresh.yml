name: Temporary Vitest 4.1.7 refresh

on:
  push:
    branches:
      - deps/vitest-4.1.7-20260817

permissions:
  contents: write

jobs:
  refresh-lockfile-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/vitest-4.1.7-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Regenerate lockfile with pnpm
        run: pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify Vitest version
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm exec vitest --version | awk '{print $2}')" = "4.1.7"

      - name: Run repository CI
        run: pnpm ci

      - name: Commit generated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-vitest-4.1.7-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/tmp-vitest-4.1.7-refresh.yml
          git commit -m "chore(deps-dev): regenerate lockfile for Vitest 4.1.7"
          git push origin HEAD:deps/vitest-4.1.7-20260817
