name: Temporary current same-major dependency refresh

on:
  push:
    branches:
      - deps/current-same-major-20260817

permissions:
  contents: write

jobs:
  refresh-lockfile-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/current-same-major-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Regenerate lockfile with pnpm
        run: pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify exact dependency versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const expected = new Map([
            ['node_modules/tailwindcss/package.json', '4.3.3'],
            ['node_modules/@tailwindcss/vite/package.json', '4.3.3'],
            ['node_modules/react-hook-form/package.json', '7.85.0'],
            ['node_modules/framer-motion/package.json', '12.43.0'],
            ['node_modules/vitest/package.json', '4.1.7'],
          ]);
          for (const [file, want] of expected) {
            const got = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (got !== want) throw new Error(`${file}: expected ${want}; got ${got}`);
            console.log(`${file}: ${got} VERIFIED`);
          }
          NODE

      - name: Format generated files
        run: pnpm exec prettier --write pnpm-lock.yaml .github/workflows/tmp-current-same-major-refresh.yml

      - name: Run repository CI
        run: pnpm run ci

      - name: Commit generated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-current-same-major-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/tmp-current-same-major-refresh.yml
          git commit -m "chore(deps): regenerate lockfile for current same-major dependencies"
          git push origin HEAD:deps/current-same-major-20260817
