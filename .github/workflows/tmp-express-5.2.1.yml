name: Temporary Express 5.2.1 migration validation

on:
  push:
    branches:
      - deps/express-5.2.1-current-main2-20260817

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/express-5.2.1-current-main2-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Resolve live registry targets
        shell: bash
        run: |
          set -euo pipefail
          express_latest="$(npm view express version)"
          types_latest="$(npm view @types/express version)"
          test "$express_latest" = "5.2.1" || {
            echo "Expected live Express latest=5.2.1; got $express_latest" >&2
            exit 1
          }
          case "$types_latest" in
            5.*) ;;
            *) echo "Expected @types/express latest on v5; got $types_latest" >&2; exit 1 ;;
          esac
          echo "EXPRESS_TARGET=$express_latest" >> "$GITHUB_ENV"
          echo "EXPRESS_TYPES_TARGET=$types_latest" >> "$GITHUB_ENV"
          echo "express=$express_latest VERIFIED"
          echo "@types/express=$types_latest VERIFIED"

      - name: Upgrade Express and matching types
        shell: bash
        run: |
          set -euo pipefail
          pnpm add "express@$EXPRESS_TARGET"
          pnpm add --save-dev "@types/express@$EXPRESS_TYPES_TARGET"

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify exact migration versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const expected = new Map([
            ['node_modules/express/package.json', process.env.EXPRESS_TARGET],
            ['node_modules/@types/express/package.json', process.env.EXPRESS_TYPES_TARGET],
            ['node_modules/nanoid/package.json', '6.0.1'],
          ]);
          for (const [file, want] of expected) {
            const got = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (got !== want) throw new Error(`${file}: expected ${want}; got ${got}`);
            console.log(`${file}: ${got} VERIFIED`);
          }
          NODE

      - name: Format migration files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml server/index.ts .github/workflows/tmp-express-5.2.1.yml

      - name: Run repository CI
        run: pnpm run ci

      - name: Smoke-test production Express server
        shell: bash
        run: |
          set -euo pipefail
          port=3100
          log_file="$(mktemp)"
          root_file="$(mktemp)"
          fallback_file="$(mktemp)"
          PORT="$port" NODE_ENV=production node dist/index.js >"$log_file" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:$port/" -o "$root_file"; then
              ready=true
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Production server exited before becoming ready" >&2
              cat "$log_file" >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Production server did not become ready" >&2
            cat "$log_file" >&2
            exit 1
          fi
          grep -Eiq '<!doctype html|<html' "$root_file" || {
            echo "Root response was not HTML" >&2
            cat "$root_file" >&2
            exit 1
          }
          curl --fail --silent --show-error \
            "http://127.0.0.1:$port/nonexistent/client-route" \
            -o "$fallback_file"
          cmp --silent "$root_file" "$fallback_file" || {
            echo "SPA fallback response differs from root shell" >&2
            exit 1
          }
          echo "Express 5 production root + SPA fallback VERIFIED"

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-express-5.2.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml server/index.ts .github/workflows/tmp-express-5.2.1.yml
          git commit -m "chore(deps): migrate Express to 5.2.1"
          git push origin HEAD:deps/express-5.2.1-current-main2-20260817
