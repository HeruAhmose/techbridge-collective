name: Temporary Express 5.2.1 migration validation

on:
  push:
    branches:
      - deps/express-5.2.1-clean-20260817

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/express-5.2.1-clean-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Assert live registry targets
        shell: bash
        run: |
          set -euo pipefail
          express_latest="$(npm view express version)"
          express_types_latest="$(npm view @types/express version)"
          test "$express_latest" = "5.2.1" || { echo "Expected express latest=5.2.1; got $express_latest" >&2; exit 1; }
          test "$express_types_latest" = "5.0.6" || { echo "Expected @types/express latest=5.0.6; got $express_types_latest" >&2; exit 1; }
          echo "express=$express_latest VERIFIED"
          echo "@types/express=$express_types_latest VERIFIED"

      - name: Upgrade Express and types
        run: pnpm add 'express@^5.2.1' && pnpm add --save-dev '@types/express@5.0.6'

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify exact migration versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const expected = new Map([
            ['node_modules/express/package.json', '5.2.1'],
            ['node_modules/@types/express/package.json', '5.0.6'],
          ]);
          for (const [file, want] of expected) {
            const got = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (got !== want) throw new Error(`${file}: expected ${want}; got ${got}`);
            console.log(`${file}: ${got} VERIFIED`);
          }
          NODE

      - name: Format migration files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml server/index.ts .github/workflows/tmp-express-5.2.1.yml

      - name: Run repository CI
        run: pnpm run ci

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-express-5.2.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml server/index.ts .github/workflows/tmp-express-5.2.1.yml
          git commit -m "chore(deps): migrate Express to 5.2.1"
          git push origin HEAD:deps/express-5.2.1-clean-20260817
