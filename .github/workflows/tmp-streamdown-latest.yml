name: Temporary Streamdown live-latest migration validation

on:
  push:
    branches:
      - deps/streamdown-latest-20260817

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/streamdown-latest-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Resolve and install live registry latest Streamdown
        shell: bash
        run: |
          set -euo pipefail
          latest="$(pnpm view streamdown version)"
          test -n "$latest"
          echo "STREAMDOWN_LATEST=$latest" >> "$GITHUB_ENV"
          echo "streamdown registry latest: $latest"
          pnpm add "streamdown@$latest"

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify installed version equals live registry target
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const got = JSON.parse(fs.readFileSync('node_modules/streamdown/package.json', 'utf8')).version;
          const want = process.env.STREAMDOWN_LATEST;
          if (!want || got !== want) throw new Error(`streamdown: expected ${want}; got ${got}`);
          console.log(`streamdown: ${got} VERIFIED`);
          NODE

      - name: Format generated files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml .github/workflows/tmp-streamdown-latest.yml

      - name: Run repository CI
        run: pnpm run ci

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-streamdown-latest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/tmp-streamdown-latest.yml
          git commit -m "chore(deps): migrate Streamdown to ${STREAMDOWN_LATEST}"
          git push origin HEAD:deps/streamdown-latest-20260817
