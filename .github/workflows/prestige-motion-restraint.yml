name: Temporary Prestige Motion Restraint

on:
  push:
    branches: [style/prestige-motion-restraint-20260823]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: style/prestige-motion-restraint-20260823
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Reduce generic hero particle noise
        shell: python
        run: |
          from pathlib import Path
          p = Path('client/src/pages/Home.tsx')
          s = p.read_text()
          s = s.replace('if (particles.length > 80) return;', 'if (particles.length > 32) return;')
          s = s.replace('style={{ opacity: 0.7 }}', 'style={{ opacity: 0.28 }}')
          s = s.replace('if (Math.random() < 0.2) addParticle();', 'if (Math.random() < 0.11) addParticle();')
          p.write_text(s)
      - name: Format changed source
        run: npx prettier --write client/src/pages/Home.tsx
      - name: Commit application change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- client/src/pages/Home.tsx; then
            echo 'No application changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/Home.tsx
          git commit -m 'style(home): restrain decorative motion for civic prestige'
          git push origin HEAD:style/prestige-motion-restraint-20260823
