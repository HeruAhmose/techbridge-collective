name: Temporary react-resizable-panels 4.12.3 migration validation

on:
  push:
    branches:
      - deps/react-resizable-panels-4.12.3-20260817

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/react-resizable-panels-4.12.3-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Upgrade react-resizable-panels
        run: pnpm add 'react-resizable-panels@^4.12.3'

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify exact migration version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'node_modules/react-resizable-panels/package.json';
          const got = JSON.parse(fs.readFileSync(file, 'utf8')).version;
          const want = '4.12.3';
          if (got !== want) throw new Error(`${file}: expected ${want}; got ${got}`);
          console.log(`${file}: ${got} VERIFIED`);
          NODE

      - name: Format migration files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml client/src/components/ui/resizable.tsx .github/workflows/tmp-react-resizable-panels-4.12.3.yml

      - name: Run repository CI
        run: pnpm run ci

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-react-resizable-panels-4.12.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml client/src/components/ui/resizable.tsx .github/workflows/tmp-react-resizable-panels-4.12.3.yml
          git commit -m "chore(deps): migrate react-resizable-panels to 4.12.3"
          git push origin HEAD:deps/react-resizable-panels-4.12.3-20260817
