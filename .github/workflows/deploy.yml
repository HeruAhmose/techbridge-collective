name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Guard and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages artifact
        run: |
          BASE_PATH="/techbridge-collective/"
          echo "Building with Vite base: $BASE_PATH"
          pnpm exec vite build --base "$BASE_PATH"

          cp dist/public/index.html dist/public/404.html
          touch dist/public/.nojekyll

          if grep -Eq '(src|href)="/(assets/|trai-organism-v5\.js)' dist/public/index.html; then
            echo "::error::GitHub Pages build contains root-relative asset references."
            exit 1
          fi

          grep -q '/techbridge-collective/assets/' dist/public/index.html
          test -f dist/public/trai-organism-v5.js
          grep -q '/techbridge-collective/trai-organism-v5.js' dist/public/index.html

      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist/public

  pages:
    name: GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
