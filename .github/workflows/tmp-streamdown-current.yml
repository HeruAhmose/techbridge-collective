name: Temporary Streamdown current migration validation

on:
  push:
    branches:
      - deps/streamdown-current-20260817

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/streamdown-current-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Resolve live registry target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view streamdown version)"
          test -n "$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Streamdown live registry target: $latest"

      - name: Upgrade Streamdown to live target
        run: pnpm add "streamdown@${{ steps.target.outputs.latest }}"

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify exact migration version
        shell: bash
        env:
          EXPECTED: ${{ steps.target.outputs.latest }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const got = JSON.parse(fs.readFileSync('node_modules/streamdown/package.json', 'utf8')).version;
          const want = process.env.EXPECTED;
          if (!want || got !== want) throw new Error(`streamdown: expected ${want}; got ${got}`);
          console.log(`streamdown: ${got} VERIFIED`);
          NODE

      - name: Format migration files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml .github/workflows/tmp-streamdown-current.yml

      - name: Run repository CI
        run: pnpm run ci

      - name: Commit migration and remove temporary workflow
        shell: bash
        env:
          STREAMDOWN_VERSION: ${{ steps.target.outputs.latest }}
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-streamdown-current.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/tmp-streamdown-current.yml
          git commit -m "chore(deps): migrate Streamdown to ${STREAMDOWN_VERSION}"
          git push origin HEAD:deps/streamdown-current-20260817
