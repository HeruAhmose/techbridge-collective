name: Validate TechBridge experience runtime

on:
  push:
    branches:
      - fix/experience-runtime-20260910

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
      - name: Apply exact repair
        run: python3 scripts/apply-experience-runtime-repair.py
      - name: Verify scope and static contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'client/index.html\nclient/src/components/SoundToggle.tsx\nclient/src/lib/TBSoundEngine.ts'
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          grep -Fq 'data-techbridge-sound={muted ? "off" : "on"}' client/src/components/SoundToggle.tsx
          grep -Fq 'this.masterGain.gain.value = 0;' client/src/lib/TBSoundEngine.ts
          ! grep -Fq 'this.enabled = true;' client/src/lib/TBSoundEngine.ts
          grep -Fq '%BASE_URL%favicon.svg' client/index.html
          test -s client/public/favicon.svg
      - name: Install locked graph
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Typecheck and build
        run: |
          pnpm check
          pnpm build
      - name: Verify compiled experience contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/public/favicon.svg
          grep -R -Fq 'data-techbridge-sound' dist/public/assets
          grep -R -Fq 'Enable sounds' dist/public/assets
      - name: Browser-certify explicit opt-in, SFX, mute, reduced motion, and favicon
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/techbridge-experience-chrome
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --disable-background-networking \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9237 \
            --remote-allow-origins='*' --user-data-dir=/tmp/techbridge-experience-chrome \
            about:blank >/tmp/techbridge-experience-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true; cat /tmp/techbridge-experience-chrome.log || true' EXIT
          for _ in $(seq 1 80); do
            curl --fail --silent http://127.0.0.1:9237/json/version >/dev/null && break
            sleep .25
          done
          curl --fail --silent http://127.0.0.1:9237/json/version >/dev/null
          TECHBRIDGE_CDP_URL=http://127.0.0.1:9237 node scripts/audit-experience-runtime.mjs
      - name: Commit verified production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Heru_Ahmose'
          git config user.email 'aitconsult22@gmail.com'
          git add client/index.html client/src/components/SoundToggle.tsx client/src/lib/TBSoundEngine.ts
          git commit -m 'fix(experience): make TechBridge sound state explicit and testable'
          git push origin HEAD:fix/experience-runtime-20260910
