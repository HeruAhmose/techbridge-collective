name: Temporary dependency census

on:
  push:
    branches:
      - audit/dependency-census-20260817

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/dependency-census-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Registry-current direct dependency census
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PNPM OUTDATED JSON BEGIN ==='
          pnpm outdated --format json || true
          echo '=== PNPM OUTDATED JSON END ==='

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-dependency-census.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-dependency-census.yml
          git commit -m "chore(audit): remove temporary dependency census workflow"
          git push origin HEAD:audit/dependency-census-20260817
