name: Lock semantic verification

on:
  push:
    branches: [chore/pnpm-lock-normalize-20260817]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout normalized branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: normalized
          ref: chore/pnpm-lock-normalize-20260817

      - name: Checkout main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: baseline
          ref: main

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Materialize both frozen graphs
        run: |
          set -euo pipefail
          (cd baseline && pnpm install --frozen-lockfile --ignore-scripts)
          (cd normalized && pnpm install --frozen-lockfile --ignore-scripts)
          (cd baseline && pnpm list --json --depth Infinity > ../baseline-tree.json)
          (cd normalized && pnpm list --json --depth Infinity > ../normalized-tree.json)

      - name: Compare resolved package name/version multisets
        run: |
          node <<'NODE'
          const fs = require('fs');

          function collect(file) {
            const roots = JSON.parse(fs.readFileSync(file, 'utf8'));
            const counts = new Map();
            const seen = new Set();
            function visit(node) {
              if (!node || typeof node !== 'object') return;
              const id = `${node.path || ''}|${node.name || ''}|${node.version || ''}`;
              if (seen.has(id)) return;
              seen.add(id);
              if (node.name && node.version) {
                const key = `${node.name}@${node.version}`;
                counts.set(key, (counts.get(key) || 0) + 1);
              }
              for (const bucket of ['dependencies','devDependencies','optionalDependencies']) {
                const deps = node[bucket];
                if (!deps) continue;
                for (const child of Object.values(deps)) visit(child);
              }
            }
            for (const root of roots) visit(root);
            return counts;
          }

          const a = collect('baseline-tree.json');
          const b = collect('normalized-tree.json');
          const keys = [...new Set([...a.keys(), ...b.keys()])].sort();
          const diff = keys.filter(k => (a.get(k) || 0) !== (b.get(k) || 0));
          if (diff.length) {
            console.error('Resolved dependency graph changed during lock normalization:');
            for (const k of diff.slice(0, 200)) console.error(`${k}: baseline=${a.get(k)||0} normalized=${b.get(k)||0}`);
            process.exit(1);
          }
          console.log(`Semantic lock verification passed: ${keys.length} package name/version identities unchanged.`);
          NODE
