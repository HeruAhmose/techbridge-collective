name: Temporary registry-current compatible refresh

on:
  push:
    branches:
      - deps/registry-current-compatible-20260817

permissions:
  contents: write

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/registry-current-compatible-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Advance current-major production dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm add \
            '@hookform/resolvers@^5.9.0' \
            '@radix-ui/react-accordion@^1.2.20' \
            '@radix-ui/react-alert-dialog@^1.1.23' \
            '@radix-ui/react-aspect-ratio@^1.1.15' \
            '@radix-ui/react-avatar@^1.2.6' \
            '@radix-ui/react-checkbox@^1.3.11' \
            '@radix-ui/react-collapsible@^1.1.20' \
            '@radix-ui/react-context-menu@^2.3.7' \
            '@radix-ui/react-dialog@^1.1.23' \
            '@radix-ui/react-dropdown-menu@^2.1.24' \
            '@radix-ui/react-hover-card@^1.1.23' \
            '@radix-ui/react-label@^2.1.15' \
            '@radix-ui/react-menubar@^1.1.24' \
            '@radix-ui/react-navigation-menu@^1.2.22' \
            '@radix-ui/react-popover@^1.1.23' \
            '@radix-ui/react-progress@^1.1.16' \
            '@radix-ui/react-radio-group@^1.4.7' \
            '@radix-ui/react-scroll-area@^1.2.18' \
            '@radix-ui/react-select@^2.3.7' \
            '@radix-ui/react-separator@^1.1.15' \
            '@radix-ui/react-slider@^1.4.7' \
            '@radix-ui/react-slot@^1.3.3' \
            '@radix-ui/react-switch@^1.3.7' \
            '@radix-ui/react-tabs@^1.1.21' \
            '@radix-ui/react-toggle@^1.1.18' \
            '@radix-ui/react-toggle-group@^1.1.19' \
            '@radix-ui/react-tooltip@^1.2.16' \
            'gsap@^3.15.0' \
            'react@^19.2.8' \
            'react-dom@^19.2.8' \
            'sonner@^2.0.8' \
            'tailwind-merge@^3.6.0' \
            'wouter@^3.10.0' \
            'zod@^4.4.3'

      - name: Advance current-major development dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm add -D \
            '@tailwindcss/typography@^0.5.20' \
            '@types/google.maps@^3.65.5' \
            '@types/react@^19.2.18' \
            '@types/react-dom@^19.2.4' \
            'autoprefixer@^10.5.4' \
            'prettier@^3.9.6' \
            'tsx@^4.23.12' \
            'vite-plugin-manus-runtime@^0.0.59' \
            'vitest@4.1.10'

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify registry-current compatibility boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm outdated --format json > /tmp/outdated.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const outdated = JSON.parse(fs.readFileSync('/tmp/outdated.json', 'utf8') || '{}');
          const allowedMajorMigrations = new Set([
            '@types/express',
            '@types/node',
            '@vitejs/plugin-react',
            'express',
            'framer-motion',
            'lucide-react',
            'nanoid',
            'pnpm',
            'react-day-picker',
            'react-resizable-panels',
            'recharts',
            'streamdown',
            'typescript',
            'vite',
          ]);
          const unexpected = Object.entries(outdated).filter(([name, info]) =>
            info.latest !== info.wanted && !allowedMajorMigrations.has(name)
          );
          if (unexpected.length) {
            console.error(JSON.stringify(Object.fromEntries(unexpected), null, 2));
            throw new Error('Unexpected non-major dependency drift remains');
          }
          console.log('REGISTRY-CURRENT COMPATIBILITY BOUNDARY VERIFIED');
          console.log('Remaining major migrations:', [...allowedMajorMigrations].sort().join(', '));
          NODE

      - name: Format generated files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml .github/workflows/tmp-registry-current-compatible.yml

      - name: Run repository CI
        run: pnpm run ci

      - name: Commit generated dependency files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-registry-current-compatible.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/tmp-registry-current-compatible.yml
          git commit -m "chore(deps): refresh registry-current compatible dependencies"
          git push origin HEAD:deps/registry-current-compatible-20260817
