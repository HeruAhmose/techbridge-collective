name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: H.K. deterministic triage tests
        run: pnpm exec vitest run client/src/lib/hkTriage.test.ts

      - name: Capture H.K. Prettier evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            client/src/components/HKChatBubble.tsx \
            client/src/lib/hkTriage.ts \
            client/src/lib/hkTriage.test.ts
          echo '=== HK_PRETTIER_DIFF_BEGIN ==='
          git diff -- \
            client/src/components/HKChatBubble.tsx \
            client/src/lib/hkTriage.ts \
            client/src/lib/hkTriage.test.ts
          echo '=== HK_PRETTIER_DIFF_END ==='

      - name: Prevent debug collector re-entry
        shell: bash
        run: |
          set -euo pipefail
          test ! -e client/public/__manus__/debug-collector.js

      - name: CI
        run: pnpm run ci

      - name: Production server SPA smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=4177 NODE_ENV=production node dist/index.js > /tmp/techbridge-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/techbridge-server.log || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4177/ -o /tmp/root.html; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error -D /tmp/headers.txt \
            http://127.0.0.1:4177/ -o /tmp/root.html
          curl --fail --silent --show-error http://127.0.0.1:4177/programs/digital-equity/deep-route -o /tmp/deep.html
          cmp --silent /tmp/root.html /tmp/deep.html
          grep --quiet '<div id="root"' /tmp/root.html
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/headers.txt
          grep -qi '^strict-transport-security: max-age=31536000' /tmp/headers.txt
          if grep -qi '^x-powered-by:' /tmp/headers.txt; then
            echo 'Express fingerprint header must remain disabled.' >&2
            exit 1
          fi

          asset_path="$(grep -oE '/assets/[^\"]+\.(js|css)' /tmp/root.html | head -n 1)"
          test -n "$asset_path"
          curl --fail --silent --show-error \
            "http://127.0.0.1:4177${asset_path}" \
            -o /tmp/techbridge-asset
          test -s /tmp/techbridge-asset
