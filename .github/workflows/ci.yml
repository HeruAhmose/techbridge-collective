name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'fix/first-party-hk-bridge-visuals-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/first-party-hk-bridge-visuals-20260823
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply fail-closed first-party visual recovery
        run: python3 scripts/first-party-visual-recovery.py

      - name: Format repaired source
        run: pnpm exec prettier --write client/src/pages/Home.tsx client/src/components/HKChatBubble.tsx client/src/components/TechBridgeVisuals.tsx

      - name: Revalidate first-party visual invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'd2xsxph8kpxj0f.cloudfront.net' client/src/pages/Home.tsx
          ! grep -q 'Powered by Claude AI' client/src/pages/Home.tsx
          ! grep -q 'Powered by Anthropic Claude' client/src/pages/Home.tsx
          ! grep -q 'augmented by generative AI' client/src/pages/Home.tsx
          grep -q 'HeroInfrastructureBackdrop' client/src/pages/Home.tsx
          grep -q 'NavigatorInfrastructureBackdrop' client/src/pages/Home.tsx
          grep -q 'HubInfrastructureVisual' client/src/pages/Home.tsx
          grep -q 'HKIdentityMark' client/src/pages/Home.tsx
          grep -q 'SpanInfrastructureBackdrop' client/src/pages/Home.tsx
          grep -q 'SuccessInfrastructureBackdrop' client/src/pages/Home.tsx
          grep -q 'button\[data-hk-launcher="true"\]' client/src/pages/Home.tsx
          grep -q 'data-hk-launcher="true"' client/src/components/HKChatBubble.tsx
          echo 'TECHBRIDGE_FIRST_PARTY_VISUAL_REPAIR=PASS'

      - name: H.K. deterministic triage regression tests
        run: pnpm exec vitest run client/src/lib/hkTriage.test.ts

      - name: Type-check
        run: pnpm check

      - name: Production build
        run: pnpm build

      - name: Restore pristine CI and remove repair scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/zz-first-party-visual-recovery.yml
          rm -f .github/repair-trigger-20260823.txt
          rm -f scripts/first-party-visual-recovery.py

      - name: Commit verified product-source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(visuals): restore first-party H.K. and bridge presence"
          git push origin HEAD:fix/first-party-hk-bridge-visuals-20260823
