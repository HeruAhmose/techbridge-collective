name: H.K. visual asset probe

on:
  push:
    branches:
      - probe/hk-visual-assets-20260823
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify external TechBridge image assets
        shell: bash
        run: |
          set -u -o pipefail
          failures=0

          probe_image() {
            local name="$1"
            local url="$2"
            local out="$3"
            local meta status content_type size

            meta=$(curl -sS -L --retry 2 --connect-timeout 10 --max-time 30 \
              -o "$out" \
              -w '%{http_code}|%{content_type}|%{size_download}' \
              "$url") || meta="CURL_ERROR||0"

            IFS='|' read -r status content_type size <<< "$meta"
            echo "$name status=$status content_type=${content_type:-none} bytes=${size:-0}"

            if [[ "$status" != "200" || "$content_type" != image/* || "${size:-0}" -le 1000 ]]; then
              echo "${name}_PUBLIC_ASSET=FAIL"
              failures=$((failures + 1))
              return 0
            fi

            file "$out"
            sha256sum "$out"
            echo "${name}_PUBLIC_ASSET=PASS"
          }

          probe_image "HK_AVATAR" "https://d2xsxph8kpxj0f.cloudfront.net/310419663029216973/6A6PRiSc2SBdMKdQGVopRa/HK_avatar_1024_6c459caf.jpg" hk-avatar.jpg
          probe_image "BRIDGE_HERO" "https://d2xsxph8kpxj0f.cloudfront.net/310419663029216973/6A6PRiSc2SBdMKdQGVopRa/bridge-hero-3L5v75UNyLV5wZc3BXy2gE.webp" bridge-hero.webp
          probe_image "COMMUNITY_HUB" "https://d2xsxph8kpxj0f.cloudfront.net/310419663029216973/6A6PRiSc2SBdMKdQGVopRa/community-hub-Q9JLQXRqmAttfmjNjBXFon.webp" community-hub.webp
          probe_image "HORACE_KING" "https://d2xsxph8kpxj0f.cloudfront.net/310419663029216973/6A6PRiSc2SBdMKdQGVopRa/horace-king-tribute-WrUcXchvoiExwCufr5cq2T.webp" horace-king.webp
          probe_image "SPAN_JOURNEY" "https://d2xsxph8kpxj0f.cloudfront.net/310419663029216973/6A6PRiSc2SBdMKdQGVopRa/span-journey-fgm8ge9JC6YczpG5dzHFSm.webp" span-journey.webp
          probe_image "NAVIGATOR_HELPING" "https://d2xsxph8kpxj0f.cloudfront.net/310419663029216973/6A6PRiSc2SBdMKdQGVopRa/community-navigator-J3QgpVMcvM5w7siVQDejbC.webp" navigator-helping.webp
          probe_image "COMMUNITY_GATHERING" "https://d2xsxph8kpxj0f.cloudfront.net/310419663029216973/6A6PRiSc2SBdMKdQGVopRa/community-gathering-7tsUyPrugQMATVzsJ7YZx2.webp" community-gathering.webp
          probe_image "HANDS_GUIDING" "https://d2xsxph8kpxj0f.cloudfront.net/310419663029216973/6A6PRiSc2SBdMKdQGVopRa/navigator-session-7Fy7vkxQXuw2y8AmS6RLxZ.webp" hands-guiding.webp
          probe_image "HUB_EXTERIOR" "https://d2xsxph8kpxj0f.cloudfront.net/310419663029216973/6A6PRiSc2SBdMKdQGVopRa/hub-exterior-Dp9FtPxyv99F7AzXgr44Ue.webp" hub-exterior.webp
          probe_image "SUCCESS_MOMENT" "https://d2xsxph8kpxj0f.cloudfront.net/310419663029216973/6A6PRiSc2SBdMKdQGVopRa/success-moment-hm2uPdPFHXpkuohVUwwfqe.webp" success-moment.webp

          echo "CDN_FAILURE_COUNT=$failures"
          test "$failures" -eq 0

      - name: Verify public production bundle carries H.K. identity and flagship asset references
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 \
            https://techbridge-collective.org/ -o index.html

          js_path=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' index.html | head -n 1)
          test -n "$js_path"
          echo "PUBLIC_JS=$js_path"

          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 \
            "https://techbridge-collective.org${js_path}" -o public.js

          grep -Fq 'H.K. ASSISTANT' public.js
          grep -Fq '24/7 GUIDE' public.js
          grep -Fq 'HK_avatar_1024_6c459caf.jpg' public.js
          grep -Fq 'bridge-hero-3L5v75UNyLV5wZc3BXy2gE.webp' public.js

          echo 'HK_PUBLIC_IDENTITY=PASS'
          echo 'HK_PUBLIC_ASSET_REFERENCES=PASS'
