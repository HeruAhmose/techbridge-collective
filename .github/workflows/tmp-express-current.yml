name: Temporary live-current Express migration validation

on:
  push:
    branches:
      - deps/express-current-20260817

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/express-current-20260817
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Resolve live registry targets
        id: target
        shell: bash
        run: |
          set -euo pipefail
          express_latest="$(npm view express version)"
          types_latest="$(npm view @types/express version)"
          test -n "$express_latest"
          test -n "$types_latest"
          echo "express=$express_latest" >> "$GITHUB_OUTPUT"
          echo "types=$types_latest" >> "$GITHUB_OUTPUT"
          echo "Express live registry target: $express_latest"
          echo "@types/express live registry target: $types_latest"

      - name: Upgrade Express runtime and types
        run: |
          pnpm add "express@${{ steps.target.outputs.express }}"
          pnpm add --save-dev "@types/express@${{ steps.target.outputs.types }}"

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify exact migration versions
        shell: bash
        env:
          EXPECTED_EXPRESS: ${{ steps.target.outputs.express }}
          EXPECTED_TYPES: ${{ steps.target.outputs.types }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const checks = [
            ['node_modules/express/package.json', process.env.EXPECTED_EXPRESS],
            ['node_modules/@types/express/package.json', process.env.EXPECTED_TYPES],
          ];
          for (const [file, want] of checks) {
            const got = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (!want || got !== want) throw new Error(`${file}: expected ${want}; got ${got}`);
            console.log(`${file}: ${got} VERIFIED`);
          }
          NODE

      - name: Format migration files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml .github/workflows/tmp-express-current.yml

      - name: Run repository CI
        run: pnpm run ci

      - name: Commit migration and remove temporary workflow
        shell: bash
        env:
          EXPRESS_VERSION: ${{ steps.target.outputs.express }}
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-express-current.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/tmp-express-current.yml
          git commit -m "chore(deps): migrate Express to ${EXPRESS_VERSION}"
          git push origin HEAD:deps/express-current-20260817
